'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#FF5A1F" text-anchor="start" letter-spacing="3" >CTF · ALWAYS OPEN</text><text x="0" y="78" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#ECEAE4">Open the third eye.</text><text x="0" y="110" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8B929B" text-anchor="start" letter-spacing="0" >A flag is hidden in the Mahadev artwork above.</text><text x="0" y="132" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8B929B" text-anchor="start" letter-spacing="0" >Three prongs stand between you and it. No brute force needed — only sight.</text><g><text x="0" y="182" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#FF5A1F" text-anchor="start" letter-spacing="2" >I</text><text x="44" y="182" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#ECEAE4" text-anchor="start" letter-spacing="3" >RECON</text><text x="160" y="182" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#ECEAE4" text-anchor="start" letter-spacing="0" >His image says more than it shows.</text><text x="160" y="204" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8B929B" text-anchor="start" letter-spacing="0" >Read it — don't look at it.</text><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;1" dur="0.60s" fill="freeze"/></g><line x1="0" y1="222" x2="600" y2="222" stroke="#262C34" stroke-width="1" stroke-dasharray="1 4"/><g><text x="0" y="244" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#FF5A1F" text-anchor="start" letter-spacing="2" >II</text><text x="44" y="244" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#ECEAE4" text-anchor="start" letter-spacing="3" >CRYPTO</text><text x="160" y="244" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#ECEAE4" text-anchor="start" letter-spacing="0" >Five syllables open the second prong.</text><text x="160" y="266" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8B929B" text-anchor="start" letter-spacing="0" >पञ्चाक्षर is the key.</text><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.467;1" dur="0.75s" fill="freeze"/></g><line x1="0" y1="284" x2="600" y2="284" stroke="#262C34" stroke-width="1" stroke-dasharray="1 4"/><g><text x="0" y="306" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#FF5A1F" text-anchor="start" letter-spacing="2" >III</text><text x="44" y="306" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#ECEAE4" text-anchor="start" letter-spacing="3" >STEGO</text><text x="160" y="306" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#ECEAE4" text-anchor="start" letter-spacing="0" >The earth beneath him speaks</text><text x="160" y="328" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8B929B" text-anchor="start" letter-spacing="0" >in two shades of ash.</text><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.556;1" dur="0.90s" fill="freeze"/></g><rect x="0.5" y="370.5" width="599" height="86" rx="8" fill="none" stroke="#262C34"/><text x="20" y="396" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#8B929B" text-anchor="start" letter-spacing="2" >SUBMIT — PROOF, NOT THE FLAG</text><text x="20" y="422" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#ECEAE4" text-anchor="start" letter-spacing="0" >$ echo -n 'flag{…}:&lt;your-login&gt;' | sha256sum</text><text x="20" y="444" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#FF5A1F" text-anchor="start" letter-spacing="0" >→ open an issue titled  ctf: &lt;hash&gt;</text><line x1="630" y1="0" x2="630" y2="470" stroke="#262C34" stroke-width="1" /><text x="660" y="22" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B929B" text-anchor="start" letter-spacing="3" >THOSE WHO SAW</text><text x="1136" y="22" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#8B929B" text-anchor="end" letter-spacing="2" >0 SOLVED · 0 ATTEMPTS</text><path d="M1096 142 V60" stroke="#3A4048" stroke-width="3" stroke-linecap="round"/><path d="M1070 76 C1070 110 1082 118 1096 118" fill="none" stroke="#3A4048" stroke-width="3" stroke-linecap="round"/><path d="M1122 76 C1122 110 1110 118 1096 118" fill="none" stroke="#3A4048" stroke-width="3" stroke-linecap="round"/><path d="M1096 54 l-6 12 h12 z" fill="#3A4048"/><path d="M1070 68 l-6 12 h12 z" fill="#3A4048"/><path d="M1122 68 l-6 12 h12 z" fill="#3A4048"/><rect x="1084" y="126" width="24" height="6" rx="3" fill="#3A4048"/><text x="660" y="86" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ECEAE4" text-anchor="start" letter-spacing="-0.5" >No one yet.</text><text x="660" y="114" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8B929B" text-anchor="start" letter-spacing="0" >First blood is still on the table.</text><text x="1136" y="462" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#8B929B" text-anchor="end" letter-spacing="1.5" >VERIFIED BY ACTIONS · HMAC-SAFE · LOGIN-BOUND</text></g></svg>
